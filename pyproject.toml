# pyproject.toml
# Updated July 2026 laelume aka Ashlae Blum(e)

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "avianz"
version = "0.0.1"
requires-python = ">=3.8"
dependencies = [
    "click==8.2.1",
    "Cython==3.1.1",
    "h5py==3.13.0",
    "jsonschema==4.24.0",
    "librosa==0.11.0",
    "lxml==5.4.0",
    "openpyxl==3.1.5",
    "matplotlib==3.10.3",
    "numba==0.61.2",
    "numpy==2.1.3",
    "pyFFTW==0.15.0",
    "pyqtgraph==0.13.7",
    "resampy==0.4.3",
    "scipy==1.15.3",
    "scikit-image==0.25.2",
    "soundfile==0.13.1",
    "tensorflow==2.19.0",
    "PyQt6==6.9.0",
]

# maps the 'avianz' shell command to a callable in the package
[project.scripts]
avianz = "avianz.AviaNZ:mainlauncher"

# replaces find_packages(where=".") from the old setup.py
[tool.setuptools.packages.find]
# where = ["."]
where = ["avianz"]